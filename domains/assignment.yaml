# Domain assignment for open-reg-tech-us-lcr (Fiction Bank LCR repo).
# LCR is a Finance regulatory reporting function — datasets belong to Finance > Regulatory Reporting.
# Run fiction-bank-firm-data-office/src/setup_domains.py first.

domain_urn: urn:li:domain:fiction-bank.finance.regulatory-reporting

datasets:
  # The 13 FR 2052a logical model tables emitted by morphir_to_datahub.py
  - platform: datahub
    name: regulation.US.LCR.Assets
    description: "FR 2052a — HQLA assets (Schedule A)"

  - platform: datahub
    name: regulation.US.LCR.Inflows.Assets
    description: "FR 2052a — Secured inflows from assets (Schedule I.A)"

  - platform: datahub
    name: regulation.US.LCR.Inflows.Other
    description: "FR 2052a — Other inflows (Schedule I.O)"

  - platform: datahub
    name: regulation.US.LCR.Inflows.Secured
    description: "FR 2052a — Secured lending inflows (Schedule I.S)"

  - platform: datahub
    name: regulation.US.LCR.Inflows.Unsecured
    description: "FR 2052a — Unsecured inflows (Schedule I.U)"

  - platform: datahub
    name: regulation.US.LCR.Outflows.Assets
    description: "FR 2052a — Asset outflows (Schedule O.A)"

  - platform: datahub
    name: regulation.US.LCR.Outflows.Deposits
    description: "FR 2052a — Deposit outflows (Schedule O.D)"

  - platform: datahub
    name: regulation.US.LCR.Outflows.Other
    description: "FR 2052a — Other outflows (Schedule O.O)"

  - platform: datahub
    name: regulation.US.LCR.Outflows.Secured
    description: "FR 2052a — Secured funding outflows (Schedule O.S)"

  - platform: datahub
    name: regulation.US.LCR.Outflows.Unsecured
    description: "FR 2052a — Unsecured outflows (Schedule O.U)"

  - platform: datahub
    name: regulation.US.LCR.Outflows.Derivatives
    description: "FR 2052a — Derivative outflows (Schedule O.Deriv)"

  - platform: datahub
    name: regulation.US.LCR.Outflows.CommittedFacilities
    description: "FR 2052a — Committed facility drawdowns (Schedule O.CF)"

  - platform: datahub
    name: regulation.US.LCR.Calculations
    description: "LCR ratio calculation — HQLA stock / net cash outflows"

term_group:
  urn: urn:li:glossaryNode:RegulatoryReporting
  description: "Terms from the LCR regulatory model (FR 2052a, BCBS 239)"
  terms_ttl: ontology/lcr-terms.ttl
  note: >
    Regulatory Reporting is a separate term group from Finance because these terms
    derive from the LCR regulatory model (open-reg-tech-us-lcr), not the Finance
    team's internal vocabulary. Both groups belong to the Finance > Regulatory
    Reporting domain; they are distinguished only within the glossary browser.
